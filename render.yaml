services:
  - type: web
    # This must match the real service name shown in the Render dashboard
    # (was "telemed-hybrid-crypto", which never matched the actual service
    # "telemedicine-secure-system" -- a pre-existing mismatch, not
    # something this fix introduced). A render.yaml whose service name
    # doesn't match an existing service can't be synced onto it.
    name: telemedicine-secure-system
    # Was runtime: python. That runtime's build image has no cmake, so
    # liboqs-python's automatic liboqs build (which only happens the first
    # time app code does `import oqs`, i.e. at container startup, not at
    # `pip install` time) failed with "cmake: not found" and the deploy
    # never came up. Render's own docs say the fix for a missing build tool
    # is Docker instead of the native runtime -- see Dockerfile and
    # CHANGES.md for the full incident writeup. buildCommand/startCommand/
    # pythonVersion are dropped because a Docker service takes its build and
    # start steps from the Dockerfile instead.
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
    healthCheckPath: /login
